name: Actualització Radar Meteocat

on:
  workflow_dispatch: # Execució manual

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout del repositori
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instal·lar dependències
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar script de descàrrega
        run: python radar_to_nc.py

      - name: Commit i Push del fitxer radar
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Afegim el nou fitxer .nc generat a la carpeta dades_radar
          git add dades_radar/*.nc
          
          # Fem el commit. El "|| exit 0" evita que el workflow falli si no hi ha canvis
          git commit -m "🛰️ Radar: Afegit nou fitxer .nc" || exit 0
          # Si un altre workflow ha fet push mentrestant, reintentem amb rebase
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
