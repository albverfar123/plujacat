name: Actualització Radar Meteocat

on:
  workflow_dispatch: # Execució manual (cron-job.org cada ~6 min)

permissions:
  contents: write   # necessari per crear Releases i pujar-hi fitxers

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Només calen l'script i les dependències: no descarreguem tot el repositori
      - name: Checkout (només l'script)
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            radar_to_nc.py
            xarxes.py
            requirements.txt
          sparse-checkout-cone-mode: false

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instal·lar dependències
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar script de descàrrega
        run: python radar_to_nc.py

      # Les imatges de 6 min ja no entren a git: es desen a una Release per dia (radar-AAAAMMDD).
      # El workflow diari les descarrega, calcula l'acumulat, les arxiva en un paquet diari
      # (Release mensual radar-arxiu-AAAAMM) i esborra la Release del dia.
      - name: Pujar la imatge a la Release del dia
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for f in dades_radar/radar_*.nc; do
            dia=$(basename "$f" | cut -c7-14)
            tag="radar-${dia}"
            gh release view "$tag" >/dev/null 2>&1 || \
              gh release create "$tag" --prerelease --title "Radar ${dia} (6 min, temporal)" \
                --notes "Imatges de radar de 6 min del ${dia} pendents de processar. S'esborra automàticament quan el workflow diari les arxiva." \
              || true   # si un altre run l'ha creat alhora, continuem
            for i in 1 2 3; do
              gh release upload "$tag" "$f" --clobber && break
              sleep $((i * 5))
            done
            echo "✅ $(basename "$f") → $tag"
          done

      # AEMET només dona les observacions horàries de les últimes ~12 h: en desem una còpia
      # cada 3 h (la primera execució de cada franja) a la Release del dia. El workflow diari
      # en calcula la pluja diària 00–24 UTC.
      - name: Recollir observacions AEMET (cada 3 h)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: |
          ara=$(date -u +%Y%m%d%H)
          dia=${ara:0:8}
          franja=$(printf "%02d" $(( 10#${ara:8:2} / 3 * 3 )))
          nom="aemet_${dia}T${franja}.json"
          tag="radar-${dia}"
          if gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$nom"; then
            echo "Franja ${franja} h ja recollida ($nom)"
            exit 0
          fi
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --prerelease --title "Radar ${dia} (6 min, temporal)" \
              --notes "Imatges de radar de 6 min del ${dia} pendents de processar. S'esborra automàticament quan el workflow diari les arxiva." \
            || true
          python xarxes.py recollir-aemet "$nom"
          gh release upload "$tag" "$nom" --clobber
          echo "✅ $nom → $tag"
