name: Acumulat Diari Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '37 7 * * *'   # 07:37 UTC = 09:37 (estiu) / 08:37 (hivern) hora catalana, després del cron de cron-job.org (08:03). Abans el Meteocat encara no ha publicat les estacions

permissions:
  contents: write

concurrency:
  group: acumulat-diari
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Descarrega les imatges de 6 min dels dies anteriors a avui (Releases radar-AAAAMMDD)
      - name: Descarregar imatges de radar pendents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dades_radar
          avui=$(date -u +%Y%m%d)
          for tag in $(gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -E '^radar-[0-9]{8}$' | sort); do
            dia=${tag#radar-}
            if [ "$dia" \< "$avui" ]; then
              echo "⬇️ $tag"
              gh release download "$tag" -D dades_radar -p 'radar_*.nc' --skip-existing
            fi
          done
          echo "Fitxers a dades_radar: $(ls dades_radar | wc -l)"

      # Processa TOTS els dies pendents a dades_radar (no només ahir) i les estacions
      - name: Run daily accumulation
        env:
          METEOCAT_API_KEY: ${{ secrets.METEOCAT_API_KEY }}
        run: |
          mkdir -p dades_radar acumulats_diaris acumulats_setmanals
          python daily_accumulation.py

      # Genera les setmanes (dl-dg) completes que encara no existeixin
      - name: Run weekly accumulation
        continue-on-error: true
        env:
          METEOCAT_API_KEY: ${{ secrets.METEOCAT_API_KEY }}
        run: python weekly_accumulation.py

      # El dia 1 de cada mes genera el mensual del mes anterior i esborra els diaris de fa més de 2 mesos
      - name: Run monthly accumulation
        continue-on-error: true
        env:
          METEOCAT_API_KEY: ${{ secrets.METEOCAT_API_KEY }}
        run: python monthly_accumulation.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p acumulats_mensuals validacio
          git add -u dades_radar/   # només esborrats: les imatges noves ja no entren a git
          git add -A acumulats_diaris/ acumulats_setmanals/ acumulats_mensuals/ validacio/ bounds.json

          if git diff --staged --quiet; then
            echo "No hi ha canvis per pujar."
            exit 0
          fi
          git commit -m "📊 Acumulat diari: Radar + Estacions ($(date +'%Y-%m-%d'))"

          # El workflow del radar fa push cada pocs minuts: reintentem amb rebase
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push rebutjat, reintent $i..."
            sleep $((i * 10))
          done
          exit 1

      # Després del push (si el push falla, les Releases del dia es conserven i es reintenta demà):
      # puja el paquet diari comprimit a la Release mensual i esborra la Release del dia
      - name: Arxivar imatges de radar
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for f in arxiu_radar/radar_*.nc; do
            dia=$(basename "$f" .nc | cut -c7-14)
            mes=${dia:0:6}
            arxiu="radar-arxiu-${mes}"
            gh release view "$arxiu" >/dev/null 2>&1 || \
              gh release create "$arxiu" --title "Arxiu radar ${mes:0:4}-${mes:4:2}" \
                --notes "Imatges de radar de 6 min empaquetades per dia (format descrit a arxiu_radar.py)." || true
            if gh release upload "$arxiu" "$f" --clobber; then
              echo "📦 $(basename "$f") → $arxiu"
              gh release delete "radar-${dia}" --yes --cleanup-tag 2>/dev/null && echo "🗑️ Release radar-${dia} esborrada" || true
            else
              echo "⚠️ No s'ha pogut pujar $f; la Release radar-${dia} es conserva"
            fi
          done
