name: Acumulat Diari Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '37 7 * * *'   # 07:37 UTC = 09:37 (estiu) / 08:37 (hivern) hora catalana, després del cron de cron-job.org (08:03). Abans el Meteocat encara no ha publicat les estacions

permissions:
  contents: write

concurrency:
  group: acumulat-diari
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Processa TOTS els dies pendents a dades_radar (no només ahir) i les estacions
      - name: Run daily accumulation
        env:
          METEOCAT_API_KEY: ${{ secrets.METEOCAT_API_KEY }}
        run: |
          mkdir -p dades_radar acumulats_diaris acumulats_setmanals
          python daily_accumulation.py

      # Genera les setmanes (dl-dg) completes que encara no existeixin
      - name: Run weekly accumulation
        continue-on-error: true
        env:
          METEOCAT_API_KEY: ${{ secrets.METEOCAT_API_KEY }}
        run: python weekly_accumulation.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -A dades_radar/ acumulats_diaris/ acumulats_setmanals/ bounds.json

          if git diff --staged --quiet; then
            echo "No hi ha canvis per pujar."
            exit 0
          fi
          git commit -m "📊 Acumulat diari: Radar + Estacions ($(date +'%Y-%m-%d'))"

          # El workflow del radar fa push cada pocs minuts: reintentem amb rebase
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push rebutjat, reintent $i..."
            sleep $((i * 10))
          done
          exit 1
