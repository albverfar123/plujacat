name: Inventari d'altres xarxes d'estacions

# Exploratori (pas 1 de la incorporació d'estacions AEMET i ACA): baixa la llista d'estacions
# i una mostra de dades de cada API i ho desa a validacio/xarxes/. Només s'executa a mà.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inventari-xarxes

jobs:
  inventari:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Inventari
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: |
          python eines/inventari_xarxes.py
          cat validacio/xarxes/resum_inventari.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and Push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add validacio/xarxes/
          git commit -m "🗂️ Inventari d'estacions AEMET i ACA" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
